<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gas monitoring field sheet</title>
<meta name="theme-color" content="#F26419">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gas sheet">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --bg:#EEF0EE; --surface:#FFFFFF; --field:#F7F8F7; --ink:#1A1D1F; --muted:#565E63; --line:#C9CFCE;
  --hv:#F26419; --hv-ink:#1A1D1F; --hv-text:#A63F06; --tape:#D4D8DA;
  --warn:#B3261E; --warn-bg:#FCE8E6; --ok:#2E6B30; --ok-bg:#E3F1E3;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121517; --surface:#1C2023; --field:#171A1C; --ink:#ECEDEC; --muted:#9BA3A7; --line:#363C40;
    --hv:#FF7A2F; --hv-ink:#121517; --hv-text:#FF9C62; --tape:#8E9599;
    --warn:#FF8A80; --warn-bg:#3A1C1A; --ok:#8FD18F; --ok-bg:#1B2E1C;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121517; --surface:#1C2023; --field:#171A1C; --ink:#ECEDEC; --muted:#9BA3A7; --line:#363C40;
  --hv:#FF7A2F; --hv-ink:#121517; --hv-text:#FF9C62; --tape:#8E9599;
  --warn:#FF8A80; --warn-bg:#3A1C1A; --ok:#8FD18F; --ok-bg:#1B2E1C;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--hv)}
button,input,textarea,select{font:inherit;color:inherit}
a{color:inherit}

/* Top bar: hi-vis band with reflective tape */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;color:var(--hv-ink);
  background:linear-gradient(to bottom,var(--hv) 0 calc(100% - 12px),var(--tape) calc(100% - 12px) calc(100% - 5px),var(--hv) calc(100% - 5px));
  padding:10px 14px 20px;display:flex;align-items:center;gap:10px}
.bar h1{font-size:19px;line-height:1.2;margin:0;font-weight:800;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .back{border:0;background:rgba(0,0,0,.12);color:var(--hv-ink);font-weight:700;border-radius:8px;padding:8px 12px;min-height:44px;cursor:pointer}
.status{font-size:12px;font-weight:600;white-space:nowrap;flex:0 0 auto;max-width:42%;overflow:hidden;text-overflow:ellipsis}
.status.err{background:var(--warn);color:#fff;padding:2px 8px;border-radius:6px}

main{max-width:720px;margin:0 auto;padding:16px 14px 120px}
h2{font-size:15px;font-weight:700;color:var(--muted);margin:26px 2px 8px}
h2:first-child{margin-top:4px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.panel + .panel{margin-top:10px}
.muted{color:var(--muted)}
.small{font-size:14px}
p{margin:0 0 8px}

/* Fields */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 12px}
.field{min-width:0}
.field.wide{grid-column:1/-1}
.field label{display:block;font-size:14px;font-weight:650;margin:0 0 4px}
.unit{font-weight:500;color:var(--muted)}
input[type=text],input[type=datetime-local],textarea{width:100%;background:var(--field);border:2px solid var(--line);border-radius:10px;padding:11px 12px;font-size:20px;min-height:52px;font-variant-numeric:tabular-nums;-webkit-appearance:none;appearance:none}
textarea{font-size:17px;min-height:96px;resize:vertical}
input:focus,textarea:focus{outline:none;border-color:var(--hv);box-shadow:0 0 0 3px color-mix(in srgb,var(--hv) 30%,transparent)}
.field.has-warn input{border-color:var(--warn)}
.warn{color:var(--warn);font-size:14px;font-weight:600;margin:4px 0 0;min-height:0}
.warn:empty{display:none}
.chips{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:15px;min-height:34px;cursor:pointer}
.chip:active{background:var(--hv);color:var(--hv-ink)}
.group-title{grid-column:1/-1;font-weight:750;font-size:16px;margin:6px 0 -4px;padding-top:10px;border-top:1px solid var(--line)}
.group-title:first-child{border-top:0;padding-top:0;margin-top:0}
.group-title .unit{font-size:14px}

/* Segmented choices */
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{flex:1 1 auto;min-height:46px;padding:8px 12px;border:2px solid var(--line);background:var(--field);border-radius:10px;font-weight:600;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--hv);border-color:var(--hv);color:var(--hv-ink)}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:10px 18px;border-radius:10px;border:2px solid var(--ink);background:transparent;font-weight:700;cursor:pointer;text-decoration:none}
.btn.primary{background:var(--ink);color:var(--bg)}
.btn.hv{background:var(--hv);border-color:var(--hv);color:var(--hv-ink)}
.btn.danger{border-color:var(--warn);color:var(--warn)}
/* Slide-to-delete */
.slide{position:relative;height:58px;border-radius:12px;border:2px solid var(--warn);background:var(--warn-bg);overflow:hidden;user-select:none;-webkit-user-select:none}
.slide-label{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:0 12px 0 64px;font-weight:700;color:var(--warn);pointer-events:none;text-align:center;line-height:1.2}
.slide-thumb{position:absolute;top:4px;left:4px;width:52px;height:46px;border-radius:9px;background:var(--warn);color:#fff;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:800;touch-action:none;cursor:grab}
.slide-thumb.anim{transition:transform .25s ease-out}
:root[data-theme="dark"] .slide-thumb{color:#121517}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .slide-thumb{color:#121517}}
.btn.block{display:flex;width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row > .btn{flex:1 1 140px}
button:focus-visible,a:focus-visible{outline:3px solid var(--hv);outline-offset:2px}

/* Lists */
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-decoration:none;min-height:64px}
.item .main{flex:1;min-width:0}
.item .title{font-weight:750}
.item .sub{font-size:14px;color:var(--muted)}
.chev{color:var(--muted);font-size:22px}
.tag{display:inline-block;background:var(--hv);color:var(--hv-ink);font-weight:800;font-size:17px;padding:5px 10px;border-radius:5px;min-width:64px;text-align:center;letter-spacing:.01em;white-space:nowrap;max-width:46vw;overflow:hidden;text-overflow:ellipsis}
.tag.fresh{background:var(--tape);color:#1A1D1F}
.prog{height:5px;border-radius:3px;background:var(--line);margin-top:6px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--ok)}
.pill{display:inline-block;font-size:13px;font-weight:700;padding:2px 8px;border-radius:6px}
.pill.warn-p{background:var(--warn-bg);color:var(--warn)}
.pill.ok-p{background:var(--ok-bg);color:var(--ok)}

.addrow{display:flex;gap:8px}
.addrow input{flex:1}
.addrow .btn{flex:0 0 auto}
.emailrow{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.emailrow input{flex:1 1 120px;min-width:0}
.suffix{font-weight:600;color:var(--muted);font-size:15px;overflow-wrap:anywhere}
.suffix[hidden]{display:none}
.emailstep{margin-top:12px;padding:12px;border:2px dashed var(--hv);border-radius:10px}
.emailstep[hidden]{display:none}

.notice{border-left:5px solid var(--hv);background:var(--surface);padding:10px 12px;border-radius:0 10px 10px 0;font-size:15px}
.empty{text-align:center;padding:28px 12px}

.footer-nav{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);
  padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:10px}
.footer-nav .btn{flex:1}
.footer-nav .btn[disabled]{opacity:.35}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:20;max-width:90vw}
.toast[hidden]{display:none}
.update{position:fixed;left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:21;background:var(--surface);border:2px solid var(--hv);border-radius:12px;padding:10px 12px;display:flex;align-items:center;gap:12px;font-weight:600;box-shadow:0 4px 16px rgba(0,0,0,.18)}
.update span{flex:1}
.version{text-align:center;margin-top:28px}
.summary dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0 0 10px}
.summary dt{color:var(--muted);font-size:14px}
.summary dd{margin:0;font-size:15px;font-weight:600}
@media (prefers-reduced-motion:no-preference){.prog i{transition:width .2s}}
.grid > .grid{grid-column:1/-1}
.last{margin:4px 0 0;font-size:13px;color:var(--muted)}
.last b{color:var(--ink);font-weight:700}
.linkbtn{border:0;background:none;padding:0;color:var(--hv-text);font-weight:700;text-decoration:underline;cursor:pointer;font-size:inherit}
.err-notice{border-left-color:var(--warn);color:var(--warn);font-weight:600}
.item .tag{flex:0 0 auto}
</style>
</head>
<body>
<div class="bar" id="bar"></div>
<main id="app"><p class="muted" style="text-align:center;padding:40px 0">Loading…</p></main>
<div class="toast" id="toast" hidden></div>
<script src="xlsx.full.min.js"></script>
<script src="firebase.js"></script>
<script src="jszip.min.js"></script>
<script src="ggt012.js"></script>
<script>
"use strict";
const APP_VERSION = "2.3"; // keep in step with CACHE in sw.js

/* ---------- Settings ---------- */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCTtWJxmTb9yGlXaas1sfK-kBBB15uq6gg",
  authDomain: "gas-monitoring-c4484.firebaseapp.com",
  projectId: "gas-monitoring-c4484",
  storageBucket: "gas-monitoring-c4484.firebasestorage.app",
  messagingSenderId: "583951556813",
  appId: "1:583951556813:web:9add99e14a9a068f490984"
};
const EMAIL_DOMAIN = "@geosphere-environmental.co.uk";
const EXTRA_ALLOWED_EMAILS = ["petercoynework@gmail.com"]; // testing only; must match the Firestore rules
const PROJECT_RE = /^(\d{4,5})((?:,[A-Z]{2,})+)$/;

/* ---------- Field definitions ---------- */
const VISIT_NOS = ["1st","2nd","3rd","4th","5th","6th"];
const INSTRUMENTS = ["GFM436 / MiniRAE (Yellow)","GFM436 / MultiRAE (Green)","Other"];
const WEATHER = [
  {k:"temp", opts:["Cold","Cool","Warm","Hot"]},
  {k:"sky",  opts:["Sunny","Cloudy","Overcast"]},
  {k:"wet",  opts:["Wet","Damp","Dry"]},
  {k:"wind", opts:["Calm","Breezy","Windy","Very windy"]}
];
const LOC_STATUS = ["Monitored","Not accessed","Destroyed"];
const TRENDS = ["Rising","Steady","Falling"];
const SEG_DEFAULTS = {status:"Monitored", pressureTrend:"Steady"};
// Instrument names as written in the GGT012 template's drop-down.
const INSTRUMENT_TEMPLATE = {"GFM436 / MiniRAE (Yellow)":"GFM436 gas analyser  / PID MiniRAE lite","GFM436 / MultiRAE (Green)":"GFM436 gas analyser  / PID MultiRAE lite"};
const GAS_CHIPS = ["<0.1","nm"];
const LOC_GROUPS = [
  {title:"Atmospheric pressure", fields:[{k:"pressure",label:"Pressure",unit:"mb",chips:["nm"]}]},
  {title:"Flow", unit:"l/hr", fields:[{k:"flowPeak",label:"Peak",chips:["0","nm"]},{k:"flowSteady",label:"Steady",chips:["0","nm"]}]},
  {title:"Methane", unit:"% v/v", fields:[{k:"ch4Peak",label:"Peak",chips:GAS_CHIPS},{k:"ch4Steady",label:"Steady",chips:GAS_CHIPS}]},
  {title:"Carbon dioxide", unit:"% v/v", fields:[{k:"co2Peak",label:"Peak",chips:GAS_CHIPS},{k:"co2Steady",label:"Steady",chips:GAS_CHIPS}]},
  {title:"Oxygen and other gases", fields:[
    {k:"o2Min",label:"Min. O₂",unit:"% v/v",chips:["nm"]},
    {k:"h2s",label:"H₂S",unit:"ppm",chips:["0","nm"]},
    {k:"co",label:"CO",unit:"ppm",chips:["0","nm"]},
    {k:"voc",label:"VOCs / PID",unit:"ppm",chips:["0","nm"]}]},
  {title:"Well", fields:[
    {k:"duration",label:"Monitoring duration",unit:"mins",chips:[]},
    {k:"pipeHeight",label:"Pipe/casing height",unit:"m",chips:["nm"]},
    {k:"depthWater",label:"Depth to water",unit:"m",chips:["Dry","nm"]},
    {k:"depthBase",label:"Depth to base of well",unit:"m",chips:["nm"]}]}
];
const LOC_FIELDS = LOC_GROUPS.flatMap(g=>g.fields);
const FRESH_FIELDS = [
  {k:"ch4",label:"Methane",unit:"% v/v",chips:GAS_CHIPS},
  {k:"co2",label:"Carbon dioxide",unit:"% v/v",chips:GAS_CHIPS},
  {k:"o2",label:"Oxygen",unit:"% v/v",chips:["nm"]},
  {k:"h2s",label:"H₂S",unit:"ppm",chips:["0","nm"]},
  {k:"co",label:"CO",unit:"ppm",chips:["0","nm"]},
  {k:"voc",label:"VOCs / PID",unit:"ppm",chips:["0","nm"]}
];

/* ---------- Helpers ---------- */
const $ = s => document.querySelector(s);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const filled = v => v !== undefined && v !== null && String(v).trim() !== "";
const isNum = v => /^-?(\d+\.?\d*|\.\d+)$/.test(String(v).trim());
const num = v => isNum(v) ? parseFloat(v) : null;
function nowLocal(){ const d=new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,16); }
function fmtDate(s, withTime=true){ if(!s) return "No date"; const d=new Date(s); if(isNaN(d)) return String(s);
  return d.toLocaleString("en-GB", withTime ? {day:"numeric",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"} : {day:"numeric",month:"short",year:"numeric"}); }
let toastTimer;
function toast(msg, ms=2600){ const t=$("#toast"); t.textContent=msg; t.hidden=false; clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.hidden=true,ms); }
function normProject(s){ return String(s||"").toUpperCase().replace(/\s+/g,""); }
function setPath(obj, path, value){ const ks=path.split("."); let o=obj; for(let i=0;i<ks.length-1;i++){ if(typeof o[ks[i]]!=="object"||o[ks[i]]===null) o[ks[i]]={}; o=o[ks[i]]; } o[ks[ks.length-1]]=value; }
function msOf(v){ const t = v && (v.toMillis ? v.toMillis() : (v.seconds ? v.seconds*1000 : v)); return typeof t==="number" ? t : 0; }
function emailAllowed(e){ e=String(e||"").toLowerCase(); return e.endsWith(EMAIL_DOMAIN) || EXTRA_ALLOWED_EMAILS.includes(e); }

/* ---------- Firebase ---------- */
let app, auth, fdb, user = null;
const projects = new Map(); // num -> project
const visits = new Map();   // id -> visit
let loaded = {projects:false, visits:false};
let pendingRemote = {projects:false, visits:false};
let syncError = "";
let unsubs = [];
let tokenRetried = false;

function startFirebase(){
  if(!window.FB){ renderFatal("The app's database code didn't load. Open it once with signal."); return; }
  app = FB.initializeApp(FIREBASE_CONFIG);
  auth = FB.initializeAuth(app, {persistence:[FB.indexedDBLocalPersistence, FB.browserLocalPersistence]});
  fdb = FB.initializeFirestore(app, {localCache: FB.persistentLocalCache({tabManager: FB.persistentMultipleTabManager()})});
  FB.onAuthStateChanged(auth, u => {
    user = u;
    stopListeners();
    if(!u) return renderSignIn();
    if(!u.emailVerified) return renderVerify();
    startListeners();
    route();
  });
}
function stopListeners(){ unsubs.forEach(f=>f()); unsubs=[]; projects.clear(); visits.clear(); loaded={projects:false,visits:false}; }
function startListeners(){
  const onErr = async e => {
    if(e && e.code==="permission-denied" && !tokenRetried && user){ tokenRetried = true; try{ await user.getIdToken(true); }catch(_){} stopListeners(); startListeners(); return; }
    syncError = e && e.code==="permission-denied"
      ? `The database refused access for ${user && user.email} (email confirmed: ${user && user.emailVerified ? "yes" : "no"}). Check the Firestore rules are published and include this address. Don't enter real readings until this says Synced.`
      : "Sync problem: " + (e && (e.code||e.message));
    paintStatus(); route();
  };
  unsubs.push(FB.onSnapshot(FB.collection(fdb,"projects"), {includeMetadataChanges:true}, snap => {
    projects.clear(); snap.forEach(d => projects.set(d.id, {...d.data(), id:d.id}));
    reapplyPending("projects", projects);
    loaded.projects = true; pendingRemote.projects = snap.metadata.hasPendingWrites; syncError=""; onData();
  }, onErr));
  unsubs.push(FB.onSnapshot(FB.query(FB.collection(fdb,"visits"), FB.where("deleted","==",false)), {includeMetadataChanges:true}, snap => {
    visits.clear(); snap.forEach(d => visits.set(d.id, {...d.data(), id:d.id}));
    reapplyPending("visits", visits);
    loaded.visits = true; pendingRemote.visits = snap.metadata.hasPendingWrites; syncError=""; onData();
  }, onErr));
}

/* Edits are applied to memory straight away and written to Firestore after a short pause.
   Firestore saves them on the phone first and sends them when there's signal. */
/* Backup: a copy of every record this phone creates or edits, kept in phone storage.
   If the database ever rejects or loses a change, it can be restored from here. */
const BACKUP_KEY = "gasfield.backup";
let backup = (()=>{ try{ const b=JSON.parse(localStorage.getItem(BACKUP_KEY)||"null"); if(b&&b.projects&&b.visits) return b; }catch(e){} return {projects:{},visits:{}}; })();
let backupTimer = null;
function markBackup(col, id){
  const o = (col==="projects"?projects:visits).get(id); if(!o) return;
  const c = JSON.parse(JSON.stringify(o)); delete c.createdAt; delete c.updatedAt; c.id = id;
  backup[col][id] = c; clearTimeout(backupTimer); backupTimer = setTimeout(saveBackup, 300);
}
function saveBackup(){ clearTimeout(backupTimer); backupTimer=null; try{ localStorage.setItem(BACKUP_KEY, JSON.stringify(backup)); }catch(e){} }
function lostRecords(){
  if(!loaded.projects || !loaded.visits || syncError || pend.size || pendingRemote.projects || pendingRemote.visits) return {projects:[], visits:[]};
  return { projects: Object.values(backup.projects).filter(b=>!projects.has(b.id)),
           visits: Object.values(backup.visits).filter(b=>!b.deleted && !visits.has(b.id)) };
}
const pend = new Map(); // "col/id" -> {col,id,fields}
let flushTimer = null;
function queueUpdate(col, id, path, value){
  const key = col+"/"+id;
  if(!pend.has(key)) pend.set(key, {col, id, fields:{}});
  pend.get(key).fields[path] = value;
  markBackup(col, id);
  clearTimeout(flushTimer); flushTimer = setTimeout(flush, 400);
  paintStatus();
}
function reapplyPending(col, map){ for(const p of pend.values()){ if(p.col!==col) continue; const o=map.get(p.id); if(o) for(const [k,v] of Object.entries(p.fields)) setPath(o,k,v); } }
function flush(){
  clearTimeout(flushTimer); flushTimer=null;
  for(const [key,p] of pend){
    pend.delete(key);
    FB.updateDoc(FB.doc(fdb, p.col, p.id), {...p.fields, updatedAt:FB.serverTimestamp(), updatedBy:user.email})
      .catch(e => { syncError = "Couldn't save a change: " + (e.code||e.message); paintStatus(); });
  }
  paintStatus();
}
window.addEventListener("pagehide", ()=>{ flush(); saveBackup(); });
document.addEventListener("visibilitychange", ()=>{ if(document.hidden) flush(); });
window.addEventListener("online", paintStatus); window.addEventListener("offline", paintStatus);
function createDoc(col, id, data){
  const full = {...data, createdAt:FB.serverTimestamp(), createdBy:user.email, updatedAt:FB.serverTimestamp(), updatedBy:user.email};
  const local = {...data, id, createdBy:user.email, updatedBy:user.email};
  (col==="projects"?projects:visits).set(id, local);
  markBackup(col, id);
  FB.setDoc(FB.doc(fdb, col, id), full, {merge:true}).catch(e => { syncError = "Couldn't save: " + (e.code||e.message); paintStatus(); });
  return local;
}

/* ---------- Data helpers ---------- */
function projLocs(p){ return Object.entries(p.locations||{}).filter(([,l])=>!l.removed).map(([id,l])=>({id,...l})).sort((a,b)=>(a.order||0)-(b.order||0)); }
function projVisits(num){ return [...visits.values()].filter(v=>v.projectNum===num).sort((a,b)=>String(a.datetime).localeCompare(String(b.datetime))); }
function lastActivity(p){ const vs=projVisits(p.id); return vs.length ? vs[vs.length-1].datetime : ""; }
function reading(v, locId){ return (v.readings && v.readings[locId]) || {}; }
function prevValue(v, locId, k){
  const vs = projVisits(v.projectNum).filter(x => x.id!==v.id && String(x.datetime) < String(v.datetime));
  for(let i=vs.length-1;i>=0;i--){ const r=reading(vs[i],locId); if(filled(r[k])) return {val:r[k], visit:vs[i].visitNo||fmtDate(vs[i].datetime,false)}; }
  return null;
}
function suggestVisitNo(num){ const used=projVisits(num).map(v=>VISIT_NOS.indexOf(v.visitNo)); const max=Math.max(-1,...used); return VISIT_NOS[max+1] || ""; }
function visitTitle(v){ const p=projects.get(v.projectNum); return `${p?p.fullNo:v.projectNum}${v.visitNo?" · "+v.visitNo+" visit":""}`; }

/* ---------- Validation (advisory only) ---------- */
function tokenOK(v){ const t=String(v).trim().toLowerCase(); return t==="nm"||t==="dry"||/^<\s*\d*\.?\d+$/.test(t); }
function checkLoc(o){
  const w = {};
  for(const f of LOC_FIELDS){ const v=o[f.k]; if(filled(v) && !isNum(v) && !tokenOK(v)) w[f.k]="Not a number. Use a value, <0.1, Dry or nm."; }
  const p=num(o.pressure); if(p!==null && (p<950||p>1060)) w.pressure="Unusual pressure. Expected roughly 950–1060 mb.";
  for(const k of ["ch4Peak","ch4Steady","co2Peak","co2Steady","o2Min"]){ const n=num(o[k]); if(n!==null&&(n<0||n>100)) w[k]="Must be between 0 and 100%."; }
  const o2=num(o.o2Min); if(o2!==null && o2>21.5 && !w.o2Min) w.o2Min="Above atmospheric oxygen (about 21%). Check.";
  for(const g of ["ch4","co2"]){ const pk=num(o[g+"Peak"]), st=num(o[g+"Steady"]); if(pk!==null&&st!==null&&st>pk&&!w[g+"Steady"]) w[g+"Steady"]="Steady is higher than peak."; }
  const ch4=Math.max(num(o.ch4Peak)??0,num(o.ch4Steady)??0), co2=Math.max(num(o.co2Peak)??0,num(o.co2Steady)??0);
  if(o2!==null && ch4+co2+o2>100.5 && !w.o2Min) w.o2Min="CH₄ + CO₂ + O₂ add up to more than 100%.";
  const dw=num(o.depthWater), db_=num(o.depthBase); if(dw!==null&&db_!==null&&dw>db_) w.depthWater="Deeper than the base of the well.";
  return w;
}
function checkFresh(o){
  const w={};
  for(const f of FRESH_FIELDS){ const v=o[f.k]; if(filled(v)&&!isNum(v)&&!tokenOK(v)) w[f.k]="Not a number. Use a value, <0.1 or nm."; }
  const c=num(o.ch4); if(c!==null&&c>=0.1&&!w.ch4) w.ch4="Fresh air should read near zero. Check the instrument.";
  const c2=num(o.co2); if(c2!==null&&c2>0.2&&!w.co2) w.co2="Fresh air should read near zero. Check the instrument.";
  const x=num(o.o2); if(x!==null&&(x<20||x>21.5)&&!w.o2) w.o2="Fresh air oxygen is usually 20.5–21%. Check calibration.";
  return w;
}
function locStatus(r){
  if(r.status && r.status!=="Monitored") return {n:LOC_FIELDS.length, total:LOC_FIELDS.length, warns:0, skipped:r.status};
  const n=LOC_FIELDS.filter(f=>filled(r[f.k])).length; return {n, total:LOC_FIELDS.length, warns:Object.keys(checkLoc(r)).length};
}

// cur.kind: home | newproj | project | projedit | visit | details | fresh | loc | import
let cur = {kind:"home"};
function curVisit(){ return cur.visitId ? visits.get(cur.visitId) : null; }
function curProject(){ return cur.projNum ? projects.get(cur.projNum) : null; }
function curObj(){
  const v=curVisit();
  if(cur.kind==="details") return v;
  if(cur.kind==="fresh") return v && (v.freshAir||{});
  if(cur.kind==="loc") return v && reading(v, cur.locId);
  if(cur.kind==="projedit") return curProject();
  return null;
}
// Where an edit to field k on the current screen is stored.
function editTarget(k){
  if(cur.kind==="details") return {col:"visits", id:cur.visitId, path:k};
  if(cur.kind==="fresh") return {col:"visits", id:cur.visitId, path:"freshAir."+k};
  if(cur.kind==="loc"){
    if(k==="name") return {col:"projects", id:curVisit().projectNum, path:`locations.${cur.locId}.name`};
    return {col:"visits", id:cur.visitId, path:`readings.${cur.locId}.${k}`};
  }
  if(cur.kind==="projedit") return {col:"projects", id:cur.projNum, path:k};
  return null;
}
function applyEdit(k, value){
  const t = editTarget(k); if(!t) return;
  const map = t.col==="projects" ? projects : visits; const o = map.get(t.id); if(!o) return;
  setPath(o, t.path, value);
  queueUpdate(t.col, t.id, t.path, value);
}

function parseNames(s){ const seen=new Set(), out=[]; String(s||"").split(/[,;\n]+/).map(x=>x.trim().toUpperCase()).filter(Boolean).forEach(x=>{ if(!seen.has(x)){ seen.add(x); out.push(x); } }); return out; }
function addLocationsTo(p, names){
  const have = new Set(projLocs(p).map(l=>l.name.toUpperCase())); const removed = Object.entries(p.locations||{}).filter(([,l])=>l.removed);
  let order = Math.max(-1, ...Object.values(p.locations||{}).map(l=>l.order||0)) + 1; const added=[], skipped=[];
  for(const n of names){
    if(have.has(n)){ skipped.push(n); continue; }
    const back = removed.find(([,l])=>l.name.toUpperCase()===n);
    if(back){ p.locations[back[0]].removed=false; queueUpdate("projects", p.id, `locations.${back[0]}.removed`, false); }
    else { const id=uid(); const l={name:n, order:order++}; p.locations = p.locations||{}; p.locations[id]=l; queueUpdate("projects", p.id, `locations.${id}`, l); }
    have.add(n); added.push(n);
  }
  flush();
  if(skipped.length) toast(`Already in this project: ${skipped.join(", ")}`); else if(added.length) toast(`Added ${added.length} location${added.length===1?"":"s"}`);
}

function restoreLost(){
  const lost = lostRecords(); const strip = b => { const c={...b}; delete c.id; return c; };
  for(const b of lost.projects){ projects.set(b.id, b); FB.setDoc(FB.doc(fdb,"projects",b.id), {...strip(b), updatedAt:FB.serverTimestamp(), updatedBy:user.email}, {merge:true}).catch(e=>{ syncError="Couldn't restore: "+(e.code||e.message); paintStatus(); }); }
  for(const b of lost.visits){ visits.set(b.id, b); FB.setDoc(FB.doc(fdb,"visits",b.id), {...strip(b), deleted:false, updatedAt:FB.serverTimestamp(), updatedBy:user.email}, {merge:true}).catch(e=>{ syncError="Couldn't restore: "+(e.code||e.message); paintStatus(); }); }
  toast(`Restoring ${lost.projects.length+lost.visits.length} records`); location.hash="#/";
}
function forgetLost(){
  if(!confirm("Remove these from the list? They won't be restored.")) return;
  const lost = lostRecords(); lost.projects.forEach(b=>delete backup.projects[b.id]); lost.visits.forEach(b=>delete backup.visits[b.id]); saveBackup(); location.hash="#/";

  const fields = {}; ["visitNo","datetime","by","instrument","instrumentOther","temp","sky","wet","wind","recentWeather","airTemp","relativeTo"].forEach(k=>fields[k]=old[k]||"");
  createDoc("visits", uid(), {...fields, projectNum:p.id, freshAir:old.freshAir||{}, readings, deleted:false, exportedAt:0});

function emailUser(){ try{ return localStorage.getItem("gasfield.emailTo") || ""; }catch(e){ return ""; } }
function emailAddress(){ const u = emailUser().trim(); if(!u) return ""; return u.includes("@") ? u : u + EMAIL_DOMAIN; }
function mailto(subject, lines){ return `mailto:${encodeURIComponent(emailAddress()).replace(/%40/g,"@")}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(lines.join("\n"))}`; }
function cellVal(v){ if(!filled(v)) return ""; return isNum(v) ? parseFloat(v) : String(v).trim(); }
function safeName(s){ return String(s||"").replace(/,/g,"-").replace(/[^\w.\-]+/g,"-").replace(/-+/g,"-").replace(/^-|-$/g,""); }
function weatherText(v){ return WEATHER.map(w=>v[w.k]).filter(filled).join(", "); }
function instText(v){ return v.instrument==="Other" ? (v.instrumentOther||"Other") : (v.instrument||""); }
const XLSX_TYPE = "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet";
const DATA_COLS = ["Location","Status","Atmospheric pressure (mb)","Pressure trend","Flow peak (l/hr)","Flow steady (l/hr)","CH4 peak (% v/v)","CH4 steady (% v/v)","CO2 peak (% v/v)","CO2 steady (% v/v)","Min O2 (% v/v)","H2S (ppm)","CO (ppm)","VOCs / PID (ppm)","Monitoring duration (mins)","Pipe/casing height (m)","Depth to water (m)","Depth to base of well (m)","Notes"];
const META_COLS = ["Project number","Site","Visit number","Date / time","Fieldwork by","Instrument","Weather","Air temp (°C)","Readings relative to"];
function visitMeta(v, p){ return [p.fullNo, p.site||"", v.visitNo||"", v.datetime||"", v.by||"", instText(v), weatherText(v), cellVal(v.airTemp), v.relativeTo||""]; }
function freshRow(v){ const fa=v.freshAir||{}; return ["Fresh air","","","","","",cellVal(fa.ch4),"",cellVal(fa.co2),"",cellVal(fa.o2),cellVal(fa.h2s),cellVal(fa.co),cellVal(fa.voc),"","","","",""]; }
function locRow(name, r, v){ const vals=LOC_FIELDS.map(f=>cellVal(r[f.k])); return [name, r.status&&r.status!=="Monitored"?r.status:"", vals[0], (v&&v.pressureTrend)||"Steady", ...vals.slice(1), r.notes||""]; }
function dataSheet(rows){ const ws=XLSX.utils.aoa_to_sheet([[...META_COLS,...DATA_COLS], ...rows]); ws["!cols"]=[...META_COLS,...DATA_COLS].map(c=>({wch:Math.max(12,Math.min(30,c.length+2))})); return ws; }
function buildVisitWorkbook(v, p){
  const header = [["GAS AND GROUNDWATER MONITORING RECORD"],[],
    ["Project number",p.fullNo],["Site",p.site||""],["Date / time",fmtDate(v.datetime)],["Visit number",v.visitNo||""],["Fieldwork by",v.by||""],
    ["Instrument",instText(v)],["Weather",weatherText(v)],["Recent weather",v.recentWeather||""],["Air temp (°C)",cellVal(v.airTemp)],["Readings relative to",v.relativeTo||""],[]];
  const rows = [freshRow(v), ...projLocs(p).map(l=>locRow(l.name, reading(v,l.id), v))];
  const ws1 = XLSX.utils.aoa_to_sheet([...header, DATA_COLS, ...rows]);
  ws1["!cols"] = [{wch:22},...DATA_COLS.slice(1,-1).map(()=>({wch:13})),{wch:50}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws1, "Field sheet");

function lel(v){ if(!filled(v)) return ""; if(isNum(v)) return Math.round(parseFloat(v)*20*10)/10; const m=String(v).trim().match(/^<\s*(\d*\.?\d+)$/); return m ? "<"+(Math.round(parseFloat(m[1])*20*10)/10) : String(v).trim(); }
function toDate(s){ const d=new Date(s); return isNaN(d) ? (s||"") : new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
function buildProjectWorkbook(p){
  const vs = projVisits(p.id), wb = XLSX.utils.book_new(), used = new Set(), allRows = [];
  const insts = [...new Set(vs.map(instText).filter(filled))].join("; ");
  for(const l of projLocs(p)){
    const aoa = [["GROUND GAS AND GROUNDWATER MONITORING DATA"],["Project Number:",p.fullNo],["Project Name:",p.site||"","","Date:",toDate(new Date())],["Exploratory Hole Location",l.name],[],
      ["Return Visit #","Monitoring Date","Atmospheric Pressure (mb)","Methane (% v/v)","Methane (% LEL)","Carbon Dioxide (% v/v)","Oxygen (% v/v)","Flow Rate (l/hr)","H2S (ppm)","CO (ppm)","VOC (ppm)","Water Level (mbgl)","Base of Well (mbgl)","Weather Conditions","Comments / Pressure Rise or Fall"]];
    for(const v of vs){
      const r = reading(v, l.id), skipped = r.status && r.status!=="Monitored";
      const comments = [];
      if(skipped) comments.push(r.status);
      if(!skipped && v.pressureTrend==="Falling") comments.push("Falling pressure");
      if(!skipped && v.pressureTrend==="Rising") comments.push("Rising pressure");

      const fromTop = v.relativeTo==="Top of pipe", ph = num(r.pipeHeight);

      if(fromTop && ph===null && (isNum(r.depthWater)||isNum(r.depthBase))) comments.push("Depths from top of pipe (no pipe height recorded)");
      if(filled(r.notes)) comments.push(r.notes.trim());

        skipped?"":cellVal(r.h2s), skipped?"":cellVal(r.co), skipped?"":cellVal(r.voc), skipped?"":bgl(r.depthWater), skipped?"":bgl(r.depthBase), weatherText(v), comments.join(". ")]);
      allRows.push([...visitMeta(v,p), ...locRow(l.name, r, v)]);
    }
    aoa.push([],["Instruments Used:",insts],["Methane, carbon dioxide and flow are peak readings. nm = not measured."]);
    const ws = XLSX.utils.aoa_to_sheet(aoa, {cellDates:true, dateNF:"dd/mm/yyyy"});
    ws["!cols"] = [{wch:16},{wch:13},{wch:13},{wch:10},{wch:10},{wch:12},{wch:10},{wch:10},{wch:8},{wch:8},{wch:8},{wch:12},{wch:12},{wch:26},{wch:40}];
    let nm = String(l.name).replace(/[\\\/\?\*\[\]:]/g,"-").slice(0,31) || "Location"; let n=2; while(used.has(nm.toUpperCase())) nm = nm.slice(0,28)+"-"+(n++); used.add(nm.toUpperCase());
    XLSX.utils.book_append_sheet(wb, ws, nm);
  }
  vs.forEach(v=>allRows.push([...visitMeta(v,p), ...freshRow(v)]));
  XLSX.utils.book_append_sheet(wb, dataSheet(allRows), "All data");
  return wb;
}
function sentenceCase(t){ t=String(t||"").toLowerCase(); return t.charAt(0).toUpperCase()+t.slice(1); }
function bglValue(v, r, val){ if(v.relativeTo!=="Top of pipe") return cellVal(val); const d=num(val), ph=num(r.pipeHeight); return (d===null||ph===null) ? cellVal(val) : Math.round((d-ph)*100)/100; }
function excelDate(s){ const d=new Date(s); if(isNaN(d)) return ""; return Math.round((Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()) - Date.UTC(1899,11,30))/86400000); }
let templateBuf = null;
async function buildGGT012Files(p){
  if(!templateBuf){ const res = await fetch("GGT012.xltx"); if(!res.ok) throw new Error("template missing"); templateBuf = await res.arrayBuffer(); }
  const vs = projVisits(p.id).slice(0,6), locs = projLocs(p);
  const locData = locs.map(l=>{
    let waterMax = 0; const remarks = [], insts = new Set();
    const rows = vs.map(v=>{
      const r = reading(v,l.id), skipped = r.status && r.status!=="Monitored", label = (v.visitNo||"?")+" visit";
      insts.add(INSTRUMENT_TEMPLATE[v.instrument] || instText(v));
      if(filled(r.notes)) remarks.push(`${label}: ${r.notes.trim()}`);
      if(skipped) return {C:label, D:excelDate(v.datetime), Q:r.status};
      const c = [];
      if(v.pressureTrend==="Falling") c.push("Falling pressure");
      if(v.pressureTrend==="Rising") c.push("Rising pressure");
      if(v.relativeTo==="Top of pipe" && num(r.pipeHeight)===null && (isNum(r.depthWater)||isNum(r.depthBase))) c.push("Depths from top of pipe (no pipe height)");
      const N = bglValue(v,r,r.depthWater), O = bglValue(v,r,r.depthBase);
      [N,O].forEach(x=>{ if(typeof x==="number") waterMax=Math.max(waterMax,x); });
      // Anything left blank on a monitored visit is written as "nm" (not measured).
      const nm = x => (x===""||x===null||x===undefined) ? "nm" : x;
      return {C:label, D:excelDate(v.datetime), E:nm(cellVal(r.pressure)), F:nm(cellVal(r.ch4Peak)), G:nm(lel(r.ch4Peak)), H:nm(cellVal(r.co2Peak)), I:nm(cellVal(r.o2Min)), J:nm(cellVal(r.flowPeak)),
        K:nm(cellVal(r.h2s)), L:nm(cellVal(r.co)), M:nm(cellVal(r.voc)), N:nm(N), O:nm(O), P:sentenceCase(weatherText(v)), Q:c.join(". ")};
    });
    return {name:l.name, rows, remarks, instruments:[...insts].filter(filled).join("; "), waterMax: waterMax ? Math.ceil(waterMax) : 0};
  });
  const chunks = []; for(let i=0;i<locData.length;i+=GGT012_MAX_TABS) chunks.push(locData.slice(i,i+GGT012_MAX_TABS));
  if(!chunks.length) chunks.push([]);
  const files = [];
  for(let i=0;i<chunks.length;i++){
    const buf = await fillGGT012(templateBuf, {fullNo:p.fullNo, dateSerial:excelDate(new Date()), locations:chunks[i]});
    const name = [safeName(p.fullNo), safeName(p.site), "GGT012-return-visits", chunks.length>1?"part"+(i+1):""].filter(filled).join("_")+".xlsx";
    files.push(new File([buf], name, {type:XLSX_TYPE}));
  }
  return files;
}
async function exportGGT012(p, mode){
  if(!window.fillGGT012 || !window.JSZip){ toast("The template code isn't loaded. Open the app once with signal."); return; }
  flush();
  if(projVisits(p.id).length>6) toast("The template has room for 6 visits. Only the first 6 are included.", 5000);
  if(!projLocs(p).length){ toast("Add monitoring locations first."); return; }
  let files; try{ files = await buildGGT012Files(p); }catch(e){ toast("Couldn't build the spreadsheet: "+(e.message||e), 6000); return; }
  const vs = projVisits(p.id);
  exportFiles(files, mode, `Gas monitoring return visits – ${p.fullNo} ${p.site||""}`.trim(),
    [`Gas monitoring return visits attached: ${files.map(f=>f.name).join(", ")}`, "", `Project: ${p.fullNo}`, `Site: ${p.site||"–"}`,
     `Visits: ${vs.map(v=>`${v.visitNo||"?"} (${fmtDate(v.datetime,false)})`).join(", ")||"–"}`, `Locations: ${projLocs(p).map(l=>l.name).join(", ")||"–"}`,
     "", "Still to complete by hand: project name and date of installation."]);
}
async function exportFiles(files, mode, subject, lines){
  if(mode==="email" && navigator.share && navigator.canShare && navigator.canShare({files})){
    try{ await navigator.share({files, title:files[0].name}); return; }
    catch(e){ if(e && e.name==="AbortError"){ toast("Cancelled. Nothing was exported."); return; } }
  }
  files.forEach((f,i)=>setTimeout(()=>downloadFile(f), i*600));
  if(mode==="email"){
    const box=$("#emailStep"); if(box){ $("#emailFile").textContent=files.map(f=>f.name).join(" and "); box.querySelector("a").href=mailto(subject, lines); box.hidden=false; clearTimeout(toastTimer); $("#toast").hidden=true; box.scrollIntoView({block:"nearest",behavior:"smooth"}); }
  } else toast(files.length>1 ? `Downloaded ${files.length} files` : "Downloaded "+files[0].name);
}
function downloadFile(file){
  const a = document.createElement("a"); a.href = URL.createObjectURL(file); a.download = file.name; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 4000);
}
async function exportFile(file, mode, subject, lines){
  if(mode==="email" && navigator.share && navigator.canShare && navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file], title:file.name}); return true; }
    catch(e){ if(e && e.name==="AbortError"){ toast("Cancelled. Nothing was exported."); return false; } }
  }
  downloadFile(file);
  if(mode==="email"){
    const box=$("#emailStep"); if(box){ $("#emailFile").textContent=file.name; box.querySelector("a").href=mailto(subject, lines); box.hidden=false; clearTimeout(toastTimer); $("#toast").hidden=true; box.scrollIntoView({block:"nearest",behavior:"smooth"}); }
  } else toast("Downloaded "+file.name);
  return true;
}
function exportVisit(v, mode){
  if(!window.XLSX){ toast("Spreadsheet export isn't loaded. Open the app once with signal."); return; }
  flush(); const p = projects.get(v.projectNum);
  const out = XLSX.write(buildVisitWorkbook(v,p), {bookType:"xlsx", type:"array"});
  const name = [safeName(p.fullNo), safeName(p.site), v.visitNo?"visit-"+v.visitNo:"", (v.datetime||"").slice(0,10)].filter(filled).join("_")+".xlsx";
  exportFile(new File([out], name, {type:XLSX_TYPE}), mode, `Gas monitoring – ${p.fullNo} ${p.site||""} – ${v.visitNo||""} visit`.replace(/\s+/g," "),
    [`Gas monitoring results attached: ${name}`, "", `Project: ${p.fullNo}`, `Site: ${p.site||"–"}`, `Visit: ${v.visitNo||"–"}`, `Date: ${fmtDate(v.datetime)}`, `Fieldwork by: ${v.by||"–"}`, `Locations: ${projLocs(p).map(l=>l.name).join(", ")||"–"}`]);
}
function exportProject(p, mode){
  if(!window.XLSX){ toast("Spreadsheet export isn't loaded. Open the app once with signal."); return; }
  flush();
  const out = XLSX.write(buildProjectWorkbook(p), {bookType:"xlsx", type:"array", cellDates:true});
  const name = [safeName(p.fullNo), safeName(p.site), "gas-monitoring-compiled", nowLocal().slice(0,10)].filter(filled).join("_")+".xlsx";
  const vs = projVisits(p.id);
  exportFile(new File([out], name, {type:XLSX_TYPE}), mode, `Gas monitoring compiled – ${p.fullNo} ${p.site||""}`.trim(),
    [`Compiled gas monitoring results attached: ${name}`, "", `Project: ${p.fullNo}`, `Site: ${p.site||"–"}`, `Visits: ${vs.map(v=>`${v.visitNo||"?"} (${fmtDate(v.datetime,false)})`).join(", ")||"–"}`, `Locations: ${projLocs(p).map(l=>l.name).join(", ")||"–"}`]);
}

/* ---------- Events ---------- */
function bindAddLoc(getP){
  const go = ()=>{ const inp=$("#addLoc"); const names=parseNames(inp.value); if(!names.length){ inp.focus(); return; } addLocationsTo(getP(), names); route(); };
  $("#addLoc").addEventListener("keydown", e=>{ if(e.key==="Enter"){ e.preventDefault(); go(); } });
  bindAddLoc.go = go;
}
function bindEmailTo(){
  $("#emailTo").addEventListener("input", e=>{ try{ localStorage.setItem("gasfield.emailTo", e.target.value.trim()); }catch(err){} $("#emailSuffix").hidden = e.target.value.includes("@"); });
}
document.addEventListener("input", e=>{
  const k = e.target.dataset && e.target.dataset.k; if(!k) return;
  applyEdit(k, e.target.value);
  if(cur.kind==="loc" && k==="name"){ const h=$("#bar h1"); if(h) h.textContent=e.target.value||"Unnamed"; }
  paintWarnings();
});
document.addEventListener("change", e=>{ if(e.target.dataset && e.target.dataset.k) flush(); });
document.addEventListener("keydown", e=>{
  if(e.key!=="Enter" || !e.target.matches("input[data-k]")) return;
  e.preventDefault(); const ins=[...document.querySelectorAll("main input[data-k], main textarea[data-k]")]; const i=ins.indexOf(e.target);
  if(ins[i+1]) ins[i+1].focus(); else e.target.blur();
});
document.addEventListener("click", e=>{
  const chip = e.target.closest(".chip");
  if(chip){ const k=chip.dataset.for, inp=$("#f_"+k); inp.value=chip.dataset.chip; applyEdit(k, chip.dataset.chip); flush(); paintWarnings(); return; }
  const segBtn = e.target.closest(".seg button");
  if(segBtn){ const seg=segBtn.parentElement, k=seg.dataset.set, o=curObj(); if(!o) return;
    let val = (o[k]===segBtn.dataset.val) ? "" : segBtn.dataset.val;
    if(!val && SEG_DEFAULTS[k]) val=SEG_DEFAULTS[k];
    applyEdit(k, val); flush();
    seg.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed", String(b.dataset.val===val)));
    if(k==="instrument"){ const x=$("#instOther"); if(x) x.hidden = val!=="Other"; }
    if(k==="status"){ const f=$("#locFields"); if(f) f.style.opacity = val==="Monitored" ? "" : ".45"; }
    if(k==="visitNo"){ const dup=projVisits(cur.projNum).filter(x=>x.id!==cur.visitId && x.visitNo && x.visitNo===val).length; $("#w_visitNo").textContent = dup?`Another visit on this project is also marked ${val}.`:""; }
    return; }
  const btn = e.target.closest("[data-act]"); if(!btn) return;
  const act = btn.dataset.act, v = curVisit(), p = curProject();
  if(act==="go"){ if(btn.dataset.href) location.hash = btn.dataset.href; }
  else if(act==="reload"){ flush(); location.reload(); }
  else if(act==="do-signin") doSignIn();
  else if(act==="do-create") doCreate();
  else if(act==="do-reset") doReset();
  else if(act==="show-create") renderSignIn("create");
  else if(act==="show-signin") renderSignIn("in");
  else if(act==="verify-continue") verifyContinue();
  else if(act==="verify-resend"){ FB.sendEmailVerification(user, {url: location.href.split("#")[0]}).then(()=>toast("Sent again. Check your inbox.")).catch(authError); }
  else if(act==="sign-out"){ flush(); FB.signOut(auth); location.hash="#/"; }
  else if(act==="toggle-completed"){ showCompleted=!showCompleted; $("#plist").innerHTML=projectListHTML(); }
  else if(act==="create-project") createProject();
  else if(act==="toggle-project-done"){ applyEdit("completed", !p.completed); flush(); toast(p.completed?"Project marked completed":"Project reopened"); route(); }
  else if(act==="new-visit") newVisit(p);
  else if(act==="add-loc") bindAddLoc.go();
  else if(act==="show-move"){ const b=$("#moveBox"); b.hidden=!b.hidden; }
  else if(act==="do-move") moveVisit(v);
  else if(act==="export-visit") exportVisit(v, btn.dataset.mode);
  else if(act==="export-project") exportProject(p, btn.dataset.mode);
  else if(act==="export-ggt") exportGGT012(p, btn.dataset.mode);
  else if(act==="do-import") importLegacy(btn.dataset.id);
  else if(act==="do-restore") restoreLost();
  else if(act==="forget-lost") forgetLost();
  else if(act==="reset-imported"){ try{ localStorage.removeItem(IMPORTED_KEY); }catch(e){} location.hash="#/import"; }
});

/* ---------- Slide to confirm ---------- */
function slideDone(act){
  const v = curVisit(); if(!v) return false;
  if(act==="del-loc"){
    const p = projects.get(v.projectNum), name = p.locations[cur.locId].name;
    p.locations[cur.locId].removed = true; queueUpdate("projects", p.id, `locations.${cur.locId}.removed`, true); flush();
    location.hash = `#/v/${v.id}`; toast(`Removed ${name} from the project`);
  } else if(act==="del-visit"){
    v.deleted = true; queueUpdate("visits", v.id, "deleted", true); flush(); saveBackup(); visits.delete(v.id);
    location.hash = `#/p/${v.projectNum}`; toast("Visit deleted");
  }
  return true;
}
function setSlide(t, x, max){
  t.style.transform = `translateX(${x}px)`;
  t.setAttribute("aria-valuenow", String(Math.round(max ? x/max*100 : 0)));
  const lab = t.parentElement.querySelector(".slide-label"); if(lab) lab.style.opacity = String(1 - (max ? x/max : 0)*0.8);
}
function resetSlide(t){ t.classList.add("anim"); setSlide(t, 0, 1); }
let drag = null;
document.addEventListener("pointerdown", e=>{
  const t = e.target.closest(".slide-thumb"); if(!t) return;
  e.preventDefault(); const s = t.parentElement;
  drag = {t, s, startX:e.clientX, max:s.clientWidth - t.offsetWidth - 8, x:0};
  t.classList.remove("anim"); t.setPointerCapture(e.pointerId);
});
document.addEventListener("pointermove", e=>{ if(!drag) return; drag.x = Math.max(0, Math.min(drag.max, e.clientX - drag.startX)); setSlide(drag.t, drag.x, drag.max); });
function endDrag(){ if(!drag) return; const d = drag; drag = null;
  if(d.x >= d.max*0.92){ setSlide(d.t, d.max, d.max); if(slideDone(d.s.dataset.slide)===false) resetSlide(d.t); } else resetSlide(d.t); }
document.addEventListener("pointerup", endDrag); document.addEventListener("pointercancel", endDrag);
document.addEventListener("keydown", e=>{
  const t = e.target.closest && e.target.closest(".slide-thumb"); if(!t) return;
  if(e.key!=="ArrowRight" && e.key!=="ArrowLeft") return;
  e.preventDefault(); const max = t.parentElement.clientWidth - t.offsetWidth - 8;
  const now = Number(t.getAttribute("aria-valuenow"))/100*max, x = Math.max(0, Math.min(max, now + (e.key==="ArrowRight" ? max/4 : -max/4)));
  t.classList.add("anim"); setSlide(t, x, max); if(x >= max*0.99 && slideDone(t.parentElement.dataset.slide)===false) resetSlide(t);
});

/* ---------- Router ---------- */
function route(keepScroll){
  if(!user) return renderSignIn();
  if(!user.emailVerified) return renderVerify();
  const y = window.scrollY;
  const p = (location.hash.slice(1)||"/").split("/").filter(Boolean);
  if(!keepScroll) window.scrollTo(0,0);
  const ready = loaded.projects && loaded.visits;
  if(p[0]==="newproject") renderNewProject();
  else if(p[0]==="import") renderImport();
  else if(p[0]==="restore") renderRestore();
  else if(ready && p[0]==="p" && projects.has(p[1])){ const pr=projects.get(p[1]); p[2]==="edit" ? renderProjectEdit(pr) : renderProject(pr); }
  else if(ready && p[0]==="v" && visits.has(p[1])){
    const v=visits.get(p[1]);
    if(p[2]==="l" && projects.has(v.projectNum) && (projects.get(v.projectNum).locations||{})[p[3]]) renderLoc(v,p[3]);
    else if(p[2]==="fresh") renderFresh(v);
    else if(p[2]==="details") renderDetails(v);
    else renderVisit(v);
  }
  else renderHome();
  if(keepScroll) window.scrollTo(0,y);
}
window.addEventListener("hashchange", ()=>route());

startFirebase();
if("serviceWorker" in navigator && location.protocol==="https:"){
  window.addEventListener("load", async ()=>{
    try{
      const reg = await navigator.serviceWorker.register("sw.js", {updateViaCache:"none"});
      document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) reg.update().catch(()=>{}); });

      navigator.serviceWorker.addEventListener("controllerchange", ()=>{
        if(!hadController){ hadController = true; return; }
        flush(); if(document.getElementById("upd")) return;
        const d = document.createElement("div"); d.id = "upd"; d.className = "update";
        d.innerHTML = '<span>A new version is ready. Your readings are saved.</span><button class="btn hv" data-act="reload">Reload</button>';
        document.body.appendChild(d);
      });
    }catch(e){}
  });
}
